<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <h1>sign up page</h1>
      <form>
           <p>Enter Full Name</p>
           <input type="text" placeholder="jhone Doe" required><br><br>
           <p>enter your phone number</p>
           <input type="number" placeholder="enter nuber" required><br><br>
           <p>enter email id</p>
           <input type="email" placeholder="apply your email" required><br><br>
           <p>choose your courses</p>
           <select>
            <option>cse</option>
            <option>mech</option>
            <option>AIML</option>
           </select><br>
           <p>select your gender</p>
           <label>male</label>
           <input name="a" type="radio" required><br><br>
             <label>female</label>
           <input type="radio" required><br><br>
             <label>other </label>
           <input type="radio" required><br><br>
           <label>upload your resume</label><br>
           <input type="file" required><br><br>
           <label>enter your feedback</label><br><br>
           <textarea placeholder="write feedback"></textarea><br><br>
           <label>price range</label>
           <input min="0" max="5" type="range" required><br><br>
           <label>enter your dob</label>
           <input type="date" required><br><br>

           <input type="submit" value="submit" required><br><br>
           <label>accept term & condition</label>
      </form>
</body>
</html>
